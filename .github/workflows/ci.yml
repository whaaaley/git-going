name: CI

on:
  push:
    branches: [main, working]
  pull_request:
    branches: [main, working]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno fmt --check
      - run: deno lint
      - run: deno check .
      - run: deno test -A
